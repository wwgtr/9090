<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Explorer</title>
    <style>
        :root {
            --bg-color: #0a0e1a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --gold: #d4a843;
            --text-main: #f0f4f8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Amiri', serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { color: var(--gold); text-align: center; }
        .surah-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .surah-item {
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .surah-item:hover { background: rgba(212, 168, 67, 0.2); }
        #ayah-display { margin-top: 20px; padding: 20px; border-top: 1px solid var(--gold); }
        canvas { width: 100%; border: 1px solid var(--gold); margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>مستكشف القرآن الكريم</h1>
    <div id="surah-list" class="surah-list"></div>
    <div id="ayah-display"></div>
    <canvas id="quranCanvas" height="200"></canvas>
</div>

<script>
    // الهيكلية المستخرجة من قاعدة بياناتك (Schema Mapping)
    const db = {
        surah: [
            { id: 1, name: "الفاتحة", total_ayahs: 7 },
            { id: 2, name: "البقرة", total_ayahs: 286 },
            { id: 3, name: "آل عمران", total_ayahs: 200 }
        ],
        ayah: [
            { id: 1, sid: 1, anum: 1, text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ" },
            { id: 2, sid: 1, anum: 2, text: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ" },
            { id: 3, sid: 2, anum: 1, text: "الم" }
        ],
        ayahs_coords: [
            { id: 1, surah: 1, ayah: 1, x: 50, y: 50, width: 200, height: 50 }
        ]
    };

    function init() {
        const list = document.getElementById('surah-list');
        db.surah.forEach(s => {
            const div = document.createElement('div');
            div.className = 'surah-item';
            div.textContent = s.name;
            div.onclick = () => showAyahs(s.id);
            list.appendChild(div);
        });
    }

    function showAyahs(surahId) {
        const display = document.getElementById('ayah-display');
        display.innerHTML = '<h2>الآيات:</h2>';
        const ayahs = db.ayah.filter(a => a.sid === surahId);
        ayahs.forEach(a => {
            const p = document.createElement('p');
            p.textContent = `(${a.anum}) ${a.text}`;
            p.onclick = () => highlightAyah(a.sid, a.anum);
            display.appendChild(p);
        });
    }

    function highlightAyah(sid, anum) {
        const canvas = document.getElementById('quranCanvas');
        const ctx = canvas.getContext('2d');
        const coord = db.ayahs_coords.find(c => c.surah === sid && c.ayah === anum);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (coord) {
            ctx.fillStyle = 'rgba(212, 168, 67, 0.5)';
            ctx.fillRect(coord.x, coord.y, coord.width, coord.height);
        }
    }

    init();
</script>

</body>
</html>
