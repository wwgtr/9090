<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quran Explorer</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --accent-color: #007aff;
            --separator-color: rgba(0, 0, 0, 0.1);
            --item-bg: rgba(255, 255, 255, 0.8);
            --item-hover: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Tajawal", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-primary: #ffffff;
                --text-secondary: #98989d;
                --glass-bg: rgba(28, 28, 30, 0.75);
                --glass-border: rgba(255, 255, 255, 0.15);
                --accent-color: #0a84ff;
                --separator-color: rgba(255, 255, 255, 0.15);
                --item-bg: rgba(28, 28, 30, 0.8);
                --item-hover: rgba(44, 44, 46, 0.95);
                --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Frosted Glass Mixin */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
        }

        /* Layout */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 24px;
            border-radius: 20px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-color), #5ac8fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: none;
            background: rgba(120, 120, 128, 0.12);
            color: var(--text-primary);
            font-size: 16px;
            transition: background 0.2s;
        }

        input[type="text"]:focus {
            background: rgba(120, 120, 128, 0.25);
        }

        .main-content {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar - Surah List */
        .sidebar {
            border-radius: 20px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .surah-item {
            padding: 14px 16px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            background: var(--item-bg);
            border: 1px solid transparent;
        }

        .surah-item:hover {
            background: var(--item-hover);
            transform: translateX(-4px);
        }

        .surah-item.active {
            border-color: var(--accent-color);
            background: rgba(0, 122, 255, 0.15);
        }

        .surah-info h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .surah-info span {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 10px;
            background: rgba(120, 120, 128, 0.15);
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Content Area - Ayah Display */
        .content-area {
            border-radius: 20px;
            padding: 24px;
            overflow-y: auto;
            position: relative;
        }

        .empty-state, .loading-state, .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--separator-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .surah-header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--separator-color);
        }

        .surah-header h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--accent-color);
        }

        .surah-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .ayah-card {
            padding: 18px;
            margin-bottom: 16px;
            background: var(--item-bg);
            border-radius: 16px;
            transition: var(--transition);
            animation: fadeUp 0.4s ease backwards;
            border: 1px solid transparent;
        }

        .ayah-card:hover {
            background: var(--item-hover);
            border-color: var(--glass-border);
            transform: translateY(-2px);
        }

        .ayah-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .ayah-num {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-color);
            background: rgba(0, 122, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .ayah-text {
            font-size: 20px;
            line-height: 2.2;
            text-align: justify;
            font-family: "Amiri", "Tajawal", serif;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .ayah-text mark {
            background: rgba(255, 204, 0, 0.3);
            color: inherit;
            padding: 0 2px;
            border-radius: 4px;
        }

        .translation-text {
            font-size: 15px;
            color: var(--text-secondary);
            font-style: italic;
            line-height: 1.5;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        footer {
            margin-top: 16px;
            padding: 14px 24px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            gap: 24px;
            align-items: center;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .social-link:hover { color: var(--accent-color); }
        .social-link svg { width: 18px; height: 18px; fill: currentColor; }

        /* Responsive */
        @media (max-width: 850px) {
            .main-content { grid-template-columns: 1fr; }
            .sidebar { display: none; } /* Mobile: Maybe add a dropdown later, for now hiding sidebar */
            .sidebar.mobile-visible { display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200; }
            .content-area { margin-bottom: 60px; }
            footer { display: none; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="glass">
        <h1>مستكشف القرآن الكريم</h1>
        <div class="search-wrapper">
            <input type="text" id="search-input" placeholder="بحث في الآيات (مثال: الصبر، الرحمة)...">
        </div>
    </header>

    <div class="main-content">
        <aside class="sidebar glass" id="sidebar">
            <!-- Surah items will be injected here -->
        </aside>

        <section class="content-area glass" id="content-area">
            <div class="loading-state" id="loader">
                <div class="spinner"></div>
                <p>جاري تحميل البيانات...</p>
            </div>
            <div id="ayah-container"></div>
        </section>
    </div>

    <footer class="glass">
        <a href="https://instagram.com/ne_7u" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            <span>ne_7u</span>
        </a>
        <a href="https://t.me/WWGTR" target="_blank" class="social-link">
            <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
            <span>WWGTR</span>
        </a>
    </footer>
</div>

<script>
    const App = {
        data: {
            surahs: [],
            ayahs: [],
            ayahsBySid: {}
        },
        state: {
            currentSurahId: null,
            searchQuery: ''
        },

        init() {
            this.elements = {
                sidebar: document.getElementById('sidebar'),
                content: document.getElementById('content-area'),
                loader: document.getElementById('loader'),
                ayahContainer: document.getElementById('ayah-container'),
                searchInput: document.getElementById('search-input')
            };

            this.loadQuranData();
            this.setupListeners();
        },

        async loadQuranData() {
            try {
                const response = await fetch('quran_data.json');
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const data = await response.json();

                // Map data from JSON
                this.data.surahs = data.surahs || [];
                this.data.ayahs = data.ayahs || [];

                // Organize ayahs by Surah ID (sid) for O(1) access
                this.data.ayahsBySid = this.data.ayahs.reduce((acc, ayah) => {
                    const sid = ayah.sid;
                    if (!acc[sid]) acc[sid] = [];
                    acc[sid].push(ayah);
                    return acc;
                }, {});

                // Sort ayahs within each surah by 'anum' (ayah number)
                Object.keys(this.data.ayahsBySid).forEach(sid => {
                    this.data.ayahsBySid[sid].sort((a, b) => a.anum - b.anum);
                });

                // Render UI
                this.elements.loader.style.display = 'none';
                this.renderSurahList();
                
                // Auto-select first surah
                if (this.data.surahs.length > 0) {
                    this.selectSurah(this.data.surahs[0].id);
                }

            } catch (error) {
                this.elements.loader.style.display = 'none';
                this.elements.content.innerHTML = `
                    <div class="error-state">
                        <p style="color: #ff3b30; font-weight: bold; font-size: 18px;">⚠️ خطأ في تحميل البيانات</p>
                        <p style="margin-top: 8px;">${error.message}</p>
                        <p style="font-size: 13px; margin-top: 12px;">تأكد من وجود ملف <code>quran_data.json</code> في نفس المجلد.</p>
                    </div>
                `;
            }
        },

        renderSurahList() {
            this.elements.sidebar.innerHTML = '';
            
            // Sort surahs by ID or index to ensure order
            const sortedSurahs = [...this.data.surahs].sort((a, b) => (a.id || a.surah_index) - (b.id || b.surah_index));

            sortedSurahs.forEach(surah => {
                const el = document.createElement('div');
                el.className = 'surah-item';
                el.dataset.id = surah.id;
                el.innerHTML = `
                    <div class="surah-info">
                        <h3>${surah.name}</h3>
                        <span>${surah.total_ayahs} آيات | ${surah.juz ? 'جزء ' + surah.juz : ''}</span>
                    </div>
                    <span class="badge">${surah.surah_index}</span>
                `;
                el.addEventListener('click', () => this.selectSurah(surah.id));
                this.elements.sidebar.appendChild(el);
            });
        },

        selectSurah(surahId) {
            this.state.currentSurahId = surahId;
            
            // Highlight in sidebar
            document.querySelectorAll('.surah-item').forEach(item => {
                item.classList.toggle('active', parseInt(item.dataset.id) === surahId);
            });

            this.renderAyahs();
        },

        renderAyahs() {
            const ayahs = this.data.ayahsBySid[this.state.currentSurahId] || [];
            const surah = this.data.surahs.find(s => s.id === this.state.currentSurahId) || {};

            // Clear container
            this.elements.ayahContainer.innerHTML = '';

            // Add Surah Header
            const header = document.createElement('div');
            header.className = 'surah-header';
            header.innerHTML = `
                <h2>سورة ${surah.name}</h2>
                <p>${surah.englishName || ''} | ${surah.total_ayahs} آيات | الجزء ${surah.juz || '-'}</p>
            `;
            this.elements.ayahContainer.appendChild(header);

            if (ayahs.length === 0) {
                this.elements.ayahContainer.innerHTML += '<p class="text-center" style="margin-top:20px; color:var(--text-secondary)">لا توجد آيات متاحة لهذه السورة في قاعدة البيانات.</p>';
                return;
            }

            // Filter by search query if present
            const filteredAyahs = this.state.searchQuery 
                ? ayahs.filter(a => (a.ar_text || '').includes(this.state.searchQuery))
                : ayahs;

            if (this.state.searchQuery && filteredAyahs.length === 0) {
                this.elements.ayahContainer.innerHTML += '<p class="text-center" style="margin-top:20px;">لا توجد نتائج مطابقة للبحث.</p>';
                return;
            }

            // Render Ayahs
            filteredAyahs.forEach((ayah, index) => {
                const el = document.createElement('div');
                el.className = 'ayah-card';
                el.style.animationDelay = `${index * 0.05}s`;

                // Highlight matching text
                let textHtml = ayah.ar_text || '';
                if (this.state.searchQuery) {
                    const regex = new RegExp(`(${this.state.searchQuery})`, 'gi');
                    textHtml = textHtml.replace(regex, '<mark>$1</mark>');
                }

                el.innerHTML = `
                    <div class="ayah-meta">
                        <span class="ayah-num">آية ${ayah.anum}</span>
                        <span class="badge">صفحة ${ayah.ayah_page_number || surah.surah_page_number || '?'}</span>
                    </div>
                    <div class="ayah-text">${textHtml}</div>
                    ${ayah.text ? `<div class="translation-text">${ayah.text}</div>` : ''}
                `;
                this.elements.ayahContainer.appendChild(el);
            });
        },

        setupListeners() {
            let searchTimeout;
            this.elements.searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    this.state.searchQuery = e.target.value.trim();
                    this.renderAyahs();
                }, 300); // Debounce search
            });
        }
    };

    // Initialize App when DOM is ready
    document.addEventListener('DOMContentLoaded', () => App.init());
</script>

</body>
</html>
